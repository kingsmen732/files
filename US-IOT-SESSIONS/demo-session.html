<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ESP32 Blockly Simulator</title>

<script src="https://unpkg.com/blockly/blockly.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        overflow: hidden;
    }

    .topbar {
        height: 60px;
        background: #111827;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        padding: 0 20px;
        gap: 10px;
    }

    button {
        background: #2563eb;
        border: none;
        color: white;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background: #1d4ed8;
    }

    .main {
        display: flex;
        height: calc(100vh - 60px);
    }

    .left-panel {
        width: 50%;
        border-right: 1px solid #1e293b;
        display: flex;
        flex-direction: column;
    }

    .right-panel {
        width: 50%;
        display: flex;
        flex-direction: column;
    }

    #blocklyDiv {
        height: 60%;
        width: 100%;
        background: #111827;
    }

    .simulator {
        flex: 1;
        position: relative;
        background: #020617;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .esp32-board {
        width: 420px;
        height: 220px;
        background: #1e293b;
        border-radius: 20px;
        position: relative;
        box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    .board-label {
        position: absolute;
        top: 15px;
        left: 20px;
        color: #cbd5e1;
        font-size: 22px;
        font-weight: bold;
    }

    .gpio-pin {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #64748b;
        position: absolute;
    }

    .gpio2 {
        top: 90px;
        left: 30px;
    }

    .wire {
        position: absolute;
        width: 180px;
        height: 4px;
        background: #facc15;
        top: 96px;
        left: 44px;
        border-radius: 5px;
    }

    .led-container {
        position: absolute;
        top: 65px;
        right: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .led {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: #220000;
        transition: all 0.1s ease;
        box-shadow: 0 0 10px rgba(255,0,0,0.2);
    }

    .led.on {
        background: red;
        box-shadow:
            0 0 20px red,
            0 0 40px red,
            0 0 60px red;
    }

    .serial-monitor {
        height: 40%;
        background: #000;
        border-top: 1px solid #1e293b;
        padding: 10px;
        overflow-y: auto;
        font-family: monospace;
        color: #22c55e;
    }

    .code-output {
        height: 100%;
        background: #111827;
        padding: 15px;
        overflow: auto;
        font-family: monospace;
        color: #7dd3fc;
        white-space: pre;
    }
</style>
</head>

<body>

<div class="topbar">
    <button onclick="runCode()">▶ Run</button>
    <button onclick="stopCode()">■ Stop</button>
    <button onclick="generateCode()">⚡ Generate JS</button>
</div>

<div class="main">

    <div class="left-panel">

        <div id="blocklyDiv"></div>

        <div class="serial-monitor" id="serial">
ESP32 Blockly Simulator Ready...
        </div>

    </div>

    <div class="right-panel">

        <div class="simulator">

            <div class="esp32-board">

                <div class="board-label">
                    ESP32 DEVKIT V1
                </div>

                <div class="gpio-pin gpio2"></div>

                <div class="wire"></div>

                <div class="led-container">
                    <div id="led" class="led"></div>
                    <div style="margin-top:10px;">
                        GPIO2 LED
                    </div>
                </div>

            </div>

        </div>

        <div class="code-output" id="codeOutput">
// Generated JavaScript appears here
        </div>

    </div>

</div>

<xml id="toolbox" style="display:none">

    <category name="LED" colour="160">

        <block type="led_on"></block>
        <block type="led_off"></block>
        <block type="wait_seconds"></block>

    </category>

    <category name="Loops" colour="210">

        <block type="controls_repeat_ext">
            <value name="TIMES">
                <shadow type="math_number">
                    <field name="NUM">5</field>
                </shadow>
            </value>
        </block>

    </category>

</xml>

<script>

    const workspace = Blockly.inject('blocklyDiv', {
        toolbox: document.getElementById('toolbox'),
        theme: Blockly.Themes.Dark
    });

    // -----------------------------
    // CUSTOM BLOCKS
    // -----------------------------

    Blockly.Blocks['led_on'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("Turn LED ON");

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(160);
        }
    };

    Blockly.Blocks['led_off'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("Turn LED OFF");

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(160);
        }
    };

    Blockly.Blocks['wait_seconds'] = {
        init: function() {
            this.appendDummyInput()
                .appendField("Wait")
                .appendField(new Blockly.FieldNumber(1, 0), "SECONDS")
                .appendField("seconds");

            this.setPreviousStatement(true);
            this.setNextStatement(true);

            this.setColour(60);
        }
    };

    // -----------------------------
    // GENERATORS
    // -----------------------------

    const generator = Blockly.JavaScript;

    generator.forBlock['led_on'] = function() {
        return 'await setLED(true);\n';
    };

    generator.forBlock['led_off'] = function() {
        return 'await setLED(false);\n';
    };

    generator.forBlock['wait_seconds'] = function(block) {
        const seconds = block.getFieldValue('SECONDS');
        return `await sleep(${seconds * 1000});\n`;
    };

    // -----------------------------
    // SIMULATION ENGINE
    // -----------------------------

    const led = document.getElementById("led");
    const serial = document.getElementById("serial");

    let running = false;

    function log(msg) {
        serial.innerHTML += "<br>> " + msg;
        serial.scrollTop = serial.scrollHeight;
    }

    async function setLED(state) {

        if (state) {
            led.classList.add("on");
            log("GPIO2 -> HIGH");
        } else {
            led.classList.remove("on");
            log("GPIO2 -> LOW");
        }

        await sleep(100);
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function generateCode() {

        const code = generator.workspaceToCode(workspace);

        document.getElementById("codeOutput").textContent = code;
    }

    async function runCode() {

        if (running) return;

        running = true;

        generateCode();

        log("Starting Blockly simulation...");

        const code = generator.workspaceToCode(workspace);

        try {

            const asyncFunction = new Function(`
                return async () => {
                    ${code}
                }
            `);

            await asyncFunction()();

        } catch(err) {

            log("ERROR: " + err.message);
        }

        running = false;
    }

    function stopCode() {

        running = false;

        led.classList.remove("on");

        log("Simulation stopped.");
    }

</script>

</body>
</html>
